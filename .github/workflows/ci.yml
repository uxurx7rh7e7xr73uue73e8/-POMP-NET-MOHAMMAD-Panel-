name: POMP NET QUANTUM NEXUS CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build production bundles
        run: npm run build

  docker-runtime-smoke:
    name: Docker startup, API and Xray runtime smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build --pull -t pompnet-quantum-nexus:ci .
      - name: Start isolated container
        run: |
          docker run -d --name pompnet-ci -p 18080:8080 \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e SIDERAIL_DATA_DIR=/data \
            -e XRAY_VERSION=v26.9.9 \
            pompnet-quantum-nexus:ci
      - name: Verify API and live Xray process
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs pompnet-ci || true
            docker rm -f pompnet-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18080/healthz -o /tmp/pompnet-health.json; then
              if node -e 'const x=require("/tmp/pompnet-health.json"); process.exit(x.ok && x.xray ? 0 : 1)'; then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Panel did not become healthy with a running Xray process."
            cat /tmp/pompnet-health.json 2>/dev/null || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:18080/api/status | tee /tmp/pompnet-status.json
          node -e 'const x=require("/tmp/pompnet-status.json"); if (x.name !== "POMP NET MOHAMMAD — QUANTUM NEXUS" || x.setup !== false) process.exit(1)'
          echo "Docker startup, API health and Xray runtime smoke test passed."
