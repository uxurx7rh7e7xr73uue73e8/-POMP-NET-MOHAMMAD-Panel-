name: POMP NET QUANTUM NEXUS CI
# Includes native WireGuard UDP, authenticated proxy and inbound-expiry regression checks.

on:
  workflow_dispatch:
  push:
    branches: [main, pompnet-quantum-redesign]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate remote node agent syntax
        run: |
          node --check node-agent/agent.mjs
          bash -n node-agent/install.sh
      - name: Build production bundles
        run: npm run build
      - name: Verify Railway capability and TCP proxy mapping logic
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          process.env.RAILWAY_PROJECT_ID = "ci-project";
          const { isPubliclyReachableInbound, getPublicTcpProxyEndpoint } =
            await import("./apps/server/dist/railway-capabilities.js");
          const inbound = (protocol, port) => ({ id: port, tag: protocol, protocol, transport: protocol === "wireguard" ? "udp" : "tcp", port, path: "", host: "", enabled: 1, created_at: Date.now(), expires_at: null });
          assert.equal(isPubliclyReachableInbound(inbound("vless", 20000)), true);
          assert.equal(isPubliclyReachableInbound(inbound("wireguard", 20011)), false);
          assert.equal(isPubliclyReachableInbound(inbound("hysteria2", 20014)), false);
          assert.equal(isPubliclyReachableInbound(inbound("tuic", 20015)), false);
          assert.equal(isPubliclyReachableInbound(inbound("socks", 20012)), false);
          process.env.RAILWAY_TCP_PROXY_INTERNAL_PORT = "20012";
          process.env.PUBLIC_TCP_PROXY_HOST = "ci.proxy.rlwy.net";
          process.env.PUBLIC_TCP_PROXY_PORT = "12345";
          assert.equal(isPubliclyReachableInbound(inbound("socks", 20012)), true);
          assert.deepEqual(getPublicTcpProxyEndpoint(inbound("socks", 20012)), { host: "ci.proxy.rlwy.net", port: 12345 });
          assert.equal(isPubliclyReachableInbound(inbound("http", 20013)), false);
          delete process.env.RAILWAY_PROJECT_ID;
          process.env.SINGBOX_TLS_CERT_FILE = "/tmp/cert.pem";
          process.env.SINGBOX_TLS_KEY_FILE = "/tmp/key.pem";
          assert.equal(isPubliclyReachableInbound(inbound("hysteria2", 20014)), true);
          assert.equal(isPubliclyReachableInbound(inbound("tuic", 20015)), true);
          console.log("Railway UDP gating and self-hosted sing-box capability checks passed.");
          NODE

  docker-runtime-smoke:
    name: Docker startup, API and Xray runtime smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build --pull -t pompnet-quantum-nexus:ci .
      - name: Start isolated container
        run: |
          mkdir -p /tmp/pompnet-certs
          openssl req -x509 -nodes -newkey rsa:2048 -keyout /tmp/pompnet-certs/server.key -out /tmp/pompnet-certs/server.crt -days 1 -subj "/CN=ci.example.com"
          docker run -d --name pompnet-ci -p 18080:8080 \
            -p 20011:20011/udp -p 20012:20012/tcp -p 20013:20013/tcp \
            -p 10808:10808/tcp -p 10809:10809/tcp -p 10810:10810/tcp -p 18443:18443/tcp \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e SIDERAIL_DATA_DIR=/data \
            -e XRAY_VERSION=v26.11.9 \
            -e SING_BOX_VERSION=1.14.4 \
            -e SINGBOX_TLS_CERT_FILE=/run/pompnet-certs/server.crt \
            -e SINGBOX_TLS_KEY_FILE=/run/pompnet-certs/server.key \
            -v /tmp/pompnet-certs:/run/pompnet-certs:ro \
            pompnet-quantum-nexus:ci
      - name: Verify API and live Xray process
        shell: bash
        run: |
          set -euo pipefail
          agent_pid=""
          cleanup() {
            if [ -n "$agent_pid" ]; then kill "$agent_pid" >/dev/null 2>&1 || true; fi
            docker logs pompnet-ci || true
            docker rm -f pompnet-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18080/healthz -o /tmp/pompnet-health.json; then
              if node -e 'const x=require("/tmp/pompnet-health.json"); process.exit(x.ok && x.xray ? 0 : 1)'; then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Panel did not become healthy with a running Xray process."
            cat /tmp/pompnet-health.json 2>/dev/null || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:18080/api/status | tee /tmp/pompnet-status.json
          node -e 'const x=require("/tmp/pompnet-status.json"); if (x.name !== "POMP NET MOHAMMAD — QUANTUM NEXUS" || x.setup !== false) process.exit(1)'
          echo "CI stage: owner setup"
                    curl -fsS -c /tmp/pompnet-cookies.txt -H "Content-Type: application/json" \
            -d '{"username":"ci-owner","password":"TempPass123!"}' \
            http://127.0.0.1:18080/api/setup > /tmp/pompnet-setup.json
          curl -fsS -b /tmp/pompnet-cookies.txt \
            http://127.0.0.1:18080/api/me > /tmp/pompnet-me.json
          node -e 'const x=require("/tmp/pompnet-me.json"); if (!x.admin || x.admin.role !== "owner") process.exit(1)'
          echo "CI stage: create initial Xray node"
                    curl -fsS -b /tmp/pompnet-cookies.txt -H "Content-Type: application/json" \
            -d '{"name":"ci-remote-node"}' \
            http://127.0.0.1:18080/api/nodes > /tmp/pompnet-node-create.json
          node -e 'const x=require("/tmp/pompnet-node-create.json"); if (!x.token || !x.id) process.exit(1)'
          node_token=$(node -e 'process.stdout.write(require("/tmp/pompnet-node-create.json").token)')
          curl -fsS -H "Authorization: Bearer $node_token" -H "Content-Type: application/json" \
            -d '{"agentVersion":"ci-test","xrayVersion":"ci-xray","platform":"linux","arch":"x64","configHash":"ci-config"}' \
            http://127.0.0.1:18080/api/node-agent/heartbeat > /tmp/pompnet-node-heartbeat.json
          node -e 'const x=require("/tmp/pompnet-node-heartbeat.json"); if (!x.ok) process.exit(1)'
          curl -fsS -H "Authorization: Bearer $node_token" \
            http://127.0.0.1:18080/api/node-agent/config > /tmp/pompnet-node-config.json
          node -e 'const x=require("/tmp/pompnet-node-config.json"); const p=(x.config?.inbounds||[]).filter(i=>i.tag!=="api").map(i=>i.protocol); if (!x.configHash || !x.config || !x.config.inbounds.some(i=>i.tag==="api") || !p.includes("wireguard") || !p.includes("vless") || !p.includes("vmess") || !p.includes("trojan") || p.some(v=>!["vless","vmess","trojan","wireguard","socks","http"].includes(v))) process.exit(1)'
          cat > /tmp/pompnet-fake-xray <<'SH'
          #!/usr/bin/env node
          if (process.argv[2] === "run" && process.argv[3] === "-test") process.exit(0);
          setInterval(() => {}, 1000);
          SH
          chmod +x /tmp/pompnet-fake-xray
          POMP_CONTROLLER_URL=http://127.0.0.1:18080 POMP_NODE_TOKEN="$node_token" XRAY_BIN=/tmp/pompnet-fake-xray POMP_NODE_DATA_DIR=/tmp/pompnet-node-agent POMP_NODE_TLS_CERT_FILE=/tmp/pompnet-certs/server.crt POMP_NODE_TLS_KEY_FILE=/tmp/pompnet-certs/server.key node node-agent/agent.mjs > /tmp/pompnet-node-agent.log 2>&1 &
          agent_pid=$!
          sleep 3
          curl -fsS -b /tmp/pompnet-cookies.txt http://127.0.0.1:18080/api/nodes > /tmp/pompnet-agent-nodes.json
          node -e 'const n=require("/tmp/pompnet-agent-nodes.json").nodes[0]; if(n.agent_version!=="1.0.0" || n.status!=="online" || !n.config_hash) process.exit(1)'
          kill "$agent_pid" >/dev/null 2>&1 || true
          wait "$agent_pid" || true
          agent_pid=""
          echo "CI stage: create Hysteria2 inbound"
                    curl -fsS -b /tmp/pompnet-cookies.txt -H "Content-Type: application/json" \
            -d '{"tag":"CI-HYSTERIA2","protocol":"hysteria2","serverName":"ci.example.com"}' \
            http://127.0.0.1:18080/api/inbounds > /tmp/pompnet-hy2.json
          echo "CI stage: create TUIC inbound"
                    curl -fsS -b /tmp/pompnet-cookies.txt -H "Content-Type: application/json" \
            -d '{"tag":"CI-TUIC","protocol":"tuic","serverName":"ci.example.com"}' \
            http://127.0.0.1:18080/api/inbounds > /tmp/pompnet-tuic.json
          hy2_id=$(node -e 'process.stdout.write(String(require("/tmp/pompnet-hy2.json").id))')
          tuic_id=$(node -e 'process.stdout.write(String(require("/tmp/pompnet-tuic.json").id))')
          hy2_port=$(node -e 'process.stdout.write(String(require("/tmp/pompnet-hy2.json").port))')
          tuic_port=$(node -e 'process.stdout.write(String(require("/tmp/pompnet-tuic.json").port))')
          echo "CI stage: create remote UDP node"
                    curl -fsS -b /tmp/pompnet-cookies.txt -H "Content-Type: application/json" \
            -d "{\"name\":\"ci-udp-node\",\"endpoint\":\"https://udp-node.example.com\",\"inboundIds\":[${hy2_id},${tuic_id}]}" \
            http://127.0.0.1:18080/api/nodes > /tmp/pompnet-udp-node-create.json
          udp_node_token=$(node -e 'process.stdout.write(require("/tmp/pompnet-udp-node-create.json").token)')
          curl -fsS -H "Authorization: Bearer $udp_node_token" http://127.0.0.1:18080/api/node-agent/config > /tmp/pompnet-udp-node-config.json
          node -e 'const x=require("/tmp/pompnet-udp-node-config.json"); const types=(x.singBoxConfig?.inbounds||[]).map(i=>i.type); if(!types.includes("hysteria2")||!types.includes("tuic")||!x.configHash) process.exit(1)'
          cat > /tmp/pompnet-fake-sing-box <<'SH'
          #!/usr/bin/env node
          if (process.argv[2] === "check") process.exit(0);
          setInterval(() => {}, 1000);
          SH
          chmod +x /tmp/pompnet-fake-sing-box
          POMP_CONTROLLER_URL=http://127.0.0.1:18080 POMP_NODE_TOKEN="$udp_node_token" XRAY_BIN=/tmp/pompnet-fake-xray SING_BOX_BIN=/tmp/pompnet-fake-sing-box POMP_NODE_DATA_DIR=/tmp/pompnet-udp-node-agent POMP_NODE_TLS_CERT_FILE=/tmp/pompnet-certs/server.crt POMP_NODE_TLS_KEY_FILE=/tmp/pompnet-certs/server.key node node-agent/agent.mjs > /tmp/pompnet-udp-node-agent.log 2>&1 &
          agent_pid=$!
          sleep 3
          curl -fsS -b /tmp/pompnet-cookies.txt http://127.0.0.1:18080/api/nodes > /tmp/pompnet-udp-node-status.json
          node -e 'const n=require("/tmp/pompnet-udp-node-status.json").nodes.find(x=>x.name==="ci-udp-node"); if(!n || n.status!=="online" || !n.config_hash) process.exit(1)'
          kill "$agent_pid" >/dev/null 2>&1 || true
          wait "$agent_pid" || true
          agent_pid=""
          curl -fsS -b /tmp/pompnet-cookies.txt http://127.0.0.1:18080/api/users > /tmp/pompnet-users.json
          curl -fsS -b /tmp/pompnet-cookies.txt http://127.0.0.1:18080/api/inbounds > /tmp/pompnet-inbounds.json
          node <<'NODE'
          const fs = require("node:fs");
          const users = require("/tmp/pompnet-users.json").users;
          const inbounds = require("/tmp/pompnet-inbounds.json");
          const user = users.find(item => item.email === "sample-user");
          if (!user?.uuid || !user?.password) throw new Error("CI sample user credentials unavailable");
          const definitions = [
            { tag: "VLESS-WS", protocol: "vless", port: 10808, settings: { vnext: [{ address: "127.0.0.1", port: 18443, users: [{ id: user.uuid, encryption: "none" }] }] } },
            { tag: "VMess-WS", protocol: "vmess", port: 10809, settings: { vnext: [{ address: "127.0.0.1", port: 18443, users: [{ id: user.uuid, alterId: 0, security: "auto" }] }] } },
            { tag: "Trojan-WS", protocol: "trojan", port: 10810, settings: { servers: [{ address: "127.0.0.1", port: 18443, password: user.password }] } },
          ];
          for (const item of definitions) {
            const inbound = inbounds.find(candidate => candidate.tag === item.tag);
            if (!inbound?.path) throw new Error("Missing seeded " + item.tag + " inbound");
            const config = {
              log: { loglevel: "warning" },
              inbounds: [{ listen: "0.0.0.0", port: item.port, protocol: "socks", settings: { auth: "noauth", udp: false } }],
              outbounds: [{
                protocol: item.protocol,
                settings: item.settings,
                streamSettings: { network: "ws", security: "tls", tlsSettings: { serverName: "ci.example.com", allowInsecure: true }, wsSettings: { path: inbound.path, headers: { Host: "ci.example.com" } } },
              }],
            };
            fs.writeFileSync("/tmp/pompnet-" + item.protocol + "-client.json", JSON.stringify(config));
          }
          NODE
          docker exec -d pompnet-ci node -e 'require("node:http").createServer((_req,res)=>res.end("POMP_NET_ROUNDTRIP_OK")).listen(18082,"0.0.0.0")'
          docker exec -d pompnet-ci node -e 'const fs=require("node:fs");const https=require("node:https");const proxy=require("http-proxy").createProxyServer({target:"http://127.0.0.1:8080",ws:true,changeOrigin:true});const server=https.createServer({key:fs.readFileSync("/run/pompnet-certs/server.key"),cert:fs.readFileSync("/run/pompnet-certs/server.crt")},(req,res)=>proxy.web(req,res));server.on("upgrade",(req,socket,head)=>proxy.ws(req,socket,head));server.listen(18443,"0.0.0.0")'
          for item in "vless:10808" "vmess:10809" "trojan:10810"; do
            protocol="${item%%:*}"
            docker cp "/tmp/pompnet-$protocol-client.json" pompnet-ci:/tmp/pompnet-$protocol-client.json
            docker exec -d pompnet-ci /data/xray/xray run -config "/tmp/pompnet-$protocol-client.json"
          done
          sleep 3
          curl --fail --silent --show-error --socks5-hostname 127.0.0.1:10808 http://127.0.0.1:18082/ | grep -q "POMP_NET_ROUNDTRIP_OK"
          curl --fail --silent --show-error --socks5-hostname 127.0.0.1:10809 http://127.0.0.1:18082/ | grep -q "POMP_NET_ROUNDTRIP_OK"
          curl --fail --silent --show-error --socks5-hostname 127.0.0.1:10810 http://127.0.0.1:18082/ | grep -q "POMP_NET_ROUNDTRIP_OK"
          echo "Real Xray client traffic round-trips passed for VLESS/WS, VMess/WS and Trojan/WS through the panel WebSocket tunnel."
          user_id=$(node -e 'process.stdout.write(String(require("/tmp/pompnet-users.json").users.find(u=>u.email==="sample-user").id))')
          echo "CI stage: assign sample user"
                    curl -fsS -b /tmp/pompnet-cookies.txt -X PUT -H "Content-Type: application/json" \
            -d "{\"inboundIds\":[${hy2_id},${tuic_id}]}" \
            "http://127.0.0.1:18080/api/users/$user_id" >/dev/null
          singbox_ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/healthz -o /tmp/pompnet-singbox-health.json; then
              if node -e 'const x=require("/tmp/pompnet-singbox-health.json"); process.exit(x.singBox?.running && x.singBox.inbounds===2 ? 0 : 1)'; then singbox_ready=1; break; fi
            fi
            sleep 2
          done
          if [ "$singbox_ready" -ne 1 ]; then cat /tmp/pompnet-singbox-health.json 2>/dev/null || true; exit 1; fi
          token=$(node -e 'process.stdout.write(require("/tmp/pompnet-users.json").users.find(u=>u.email==="sample-user").sub_token)')
          echo "CI stage: fetch subscription"
                    curl -fsS "http://127.0.0.1:18080/sub/$token?raw=1" | base64 -d > /tmp/pompnet-udp-sub.txt
          grep -q "^hysteria2://" /tmp/pompnet-udp-sub.txt
          grep -q "^tuic://" /tmp/pompnet-udp-sub.txt
          curl -fsS "http://127.0.0.1:18080/sub/$token/clash" > /tmp/pompnet-udp-clash.yaml
          grep -q 'type: "hysteria2"' /tmp/pompnet-udp-clash.yaml
          grep -q 'type: "tuic"' /tmp/pompnet-udp-clash.yaml
          curl -fsS "http://127.0.0.1:18080/sub/$token/singbox" > /tmp/pompnet-udp-singbox.json
          node -e 'const x=require("/tmp/pompnet-udp-singbox.json"); const types=(x.outbounds||[]).map(o=>o.type); if(!types.includes("hysteria2") || !types.includes("tuic")) process.exit(1)'
          docker exec pompnet-ci node -e '
            const ports=process.argv.slice(1).map(Number);
            const fs=require("node:fs");
            const rows=["/proc/net/udp","/proc/net/udp6"].flatMap(file=>{try{return fs.readFileSync(file,"utf8").trim().split("\n").slice(1)}catch{return[]}});
            for(const port of ports){const hex=port.toString(16).toUpperCase().padStart(4,"0");if(!rows.some(line=>line.trim().split(/\s+/)[1]?.endsWith(":"+hex))){console.error("Missing UDP listener",port);process.exit(1)}}
            console.log("sing-box Hysteria2/TUIC UDP listeners verified:",ports.join(", "));
          ' "$hy2_port" "$tuic_port"
          curl -fsS -b /tmp/pompnet-cookies.txt http://127.0.0.1:18080/api/nodes > /tmp/pompnet-nodes.json
          node -e 'const x=require("/tmp/pompnet-nodes.json"); if (!x.nodes || x.nodes[0].status!=="online") process.exit(1)'
          echo "Authenticated remote-node registry, heartbeat and scoped Xray config API passed."
          docker exec pompnet-ci node -e '
            const net = require("node:net");
            const ports = [20000, 20001, 20002, 20003, 20004, 20012, 20013];
            Promise.all(ports.map(port => new Promise((resolve, reject) => {
              const socket = net.createConnection({host:"127.0.0.1", port});
              socket.setTimeout(4000);
              socket.once("connect", () => { socket.destroy(); resolve(port); });
              socket.once("timeout", () => { socket.destroy(); reject(new Error("timeout on "+port)); });
              socket.once("error", reject);
            }))).then(open => {
              console.log("Xray inbound TCP listeners open:", open.join(", "));
            }).catch(error => { console.error(error); process.exit(1); });
          '
          docker exec pompnet-ci node -e '
            const fs = require("node:fs");
            const tables = ["/proc/net/udp", "/proc/net/udp6"];
            const rows = tables.flatMap(file => {
              try { return fs.readFileSync(file, "utf8").trim().split("\n").slice(1); }
              catch { return []; }
            });
            const port = rows.some(line => line.trim().split(/\s+/)[1]?.endsWith(":4E2B"));
            if (!port) {
              console.error("WireGuard UDP listener 20011 is missing from both IPv4 and IPv6 UDP tables");
              process.exit(1);
            }
            console.log("WireGuard UDP listener 20011 is bound.");
          '
          token=$(docker exec pompnet-ci node --input-type=module -e '
            import { DatabaseSync } from "node:sqlite";
            const db = new DatabaseSync("/data/siderail.db");
            const row = db.prepare("SELECT sub_token FROM users WHERE email = ?").get("sample-user");
            if (!row) process.exit(1);
            process.stdout.write(row.sub_token);
            db.close();
          ')
          curl -fsS "http://127.0.0.1:18080/sub/$token?raw=1" | base64 -d > /tmp/pompnet-sub.txt
          grep -q "^wireguard://" /tmp/pompnet-sub.txt
          grep -q "^socks://" /tmp/pompnet-sub.txt
          grep -q "^http://" /tmp/pompnet-sub.txt
          echo "Docker image, API/auth, Xray core, TCP/UDP inbound listeners and WireGuard/SOCKS/HTTP subscription links passed."
      - name: Verify Railway-mode subscription filtering and TCP proxy URI
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs pompnet-railway-ci || true
            docker rm -f pompnet-railway-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name pompnet-railway-ci -p 18081:8080 \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e SIDERAIL_DATA_DIR=/data \
            -e XRAY_VERSION=v26.11.9 \
            -e RAILWAY_PROJECT_ID=ci-project \
            -e RAILWAY_TCP_PROXY_INTERNAL_PORT=20012 \
            -e PUBLIC_TCP_PROXY_HOST=ci.proxy.rlwy.net \
            -e PUBLIC_TCP_PROXY_PORT=12345 \
            pompnet-quantum-nexus:ci
          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18081/healthz -o /tmp/pompnet-railway-health.json; then
              if node -e 'const x=require("/tmp/pompnet-railway-health.json"); process.exit(x.ok && x.xray ? 0 : 1)'; then ready=1; break; fi
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/pompnet-railway-health.json 2>/dev/null || true; exit 1; fi
          curl -fsS -H "Content-Type: application/json" \
            -d '{"username":"ci-owner","password":"TempPass123!"}' \
            http://127.0.0.1:18081/api/setup > /tmp/pompnet-railway-setup.json
          owner_token=$(node -e 'process.stdout.write(require("/tmp/pompnet-railway-setup.json").token)')
          curl -fsS -H "Authorization: Bearer $owner_token" http://127.0.0.1:18081/api/inbounds > /tmp/pompnet-railway-inbounds.json
          wg_id=$(node -e 'process.stdout.write(String(require("/tmp/pompnet-railway-inbounds.json").find(i=>i.protocol==="wireguard").id))')
          vless_id=$(node -e 'process.stdout.write(String(require("/tmp/pompnet-railway-inbounds.json").find(i=>i.tag==="VLESS-WS").id))')
          curl -fsS -H "Authorization: Bearer $owner_token" -H "Content-Type: application/json" \
            -d '{"tag":"CI-RAILWAY-HYSTERIA2","protocol":"hysteria2","serverName":"ci.example.com"}' \
            http://127.0.0.1:18081/api/inbounds > /tmp/pompnet-railway-hy2.json
          curl -fsS -H "Authorization: Bearer $owner_token" -H "Content-Type: application/json" \
            -d '{"tag":"CI-RAILWAY-TUIC","protocol":"tuic","serverName":"ci.example.com"}' \
            http://127.0.0.1:18081/api/inbounds > /tmp/pompnet-railway-tuic.json
          hy2_id=$(node -e 'process.stdout.write(String(require("/tmp/pompnet-railway-hy2.json").id))')
          tuic_id=$(node -e 'process.stdout.write(String(require("/tmp/pompnet-railway-tuic.json").id))')
          curl -fsS -H "Authorization: Bearer $owner_token" -H "Content-Type: application/json" \
            -d "{\"name\":\"ci-wireguard-node\",\"endpoint\":\"https://wg-node.example.com\",\"inboundIds\":[${wg_id}]}" \
            http://127.0.0.1:18081/api/nodes > /tmp/pompnet-railway-node.json
          node_token=$(node -e 'process.stdout.write(require("/tmp/pompnet-railway-node.json").token)')
          curl -fsS -H "Authorization: Bearer $node_token" -H "Content-Type: application/json" \
            -d '{"agentVersion":"ci-test","xrayVersion":"ci-xray","platform":"linux","arch":"x64","configHash":"ci-config"}' \
            http://127.0.0.1:18081/api/node-agent/heartbeat >/dev/null
          curl -fsS -H "Authorization: Bearer $node_token" http://127.0.0.1:18081/api/node-agent/config > /tmp/pompnet-railway-node-config.json
          node -e 'const x=require("/tmp/pompnet-railway-node-config.json"); if (!x.config.inbounds.some(i=>i.protocol==="wireguard" && i.listen==="0.0.0.0") || x.config.inbounds.some(i=>i.tag!=="api" && i.protocol!=="wireguard")) process.exit(1)'
          curl -fsS -H "Authorization: Bearer $owner_token" -H "Content-Type: application/json" \
            -d "{\"name\":\"ci-vless-node\",\"endpoint\":\"https://vless-node.example.com\",\"inboundIds\":[${vless_id}]}" \
            http://127.0.0.1:18081/api/nodes > /tmp/pompnet-railway-vless-node.json
          vless_node_token=$(node -e 'process.stdout.write(require("/tmp/pompnet-railway-vless-node.json").token)')
          curl -fsS -H "Authorization: Bearer $vless_node_token" -H "Content-Type: application/json" \
            -d '{"agentVersion":"ci-test","xrayVersion":"ci-xray","platform":"linux","arch":"x64","configHash":"ci-vless-config"}' \
            http://127.0.0.1:18081/api/node-agent/heartbeat >/dev/null
          curl -fsS -H "Authorization: Bearer $vless_node_token" http://127.0.0.1:18081/api/node-agent/config > /tmp/pompnet-railway-vless-node-config.json
          node -e 'const x=require("/tmp/pompnet-railway-vless-node-config.json"); if (!x.config.inbounds.some(i=>i.protocol==="vless" && i.listen==="0.0.0.0") || x.config.inbounds.some(i=>i.tag!=="api" && i.protocol!=="vless")) process.exit(1)'
          curl -fsS -H "Authorization: Bearer $owner_token" -H "Content-Type: application/json" \
            -d "{\"name\":\"ci-udp-node\",\"endpoint\":\"https://udp-node.example.com\",\"inboundIds\":[${hy2_id},${tuic_id}]}" \
            http://127.0.0.1:18081/api/nodes > /tmp/pompnet-railway-udp-node.json
          udp_node_token=$(node -e 'process.stdout.write(require("/tmp/pompnet-railway-udp-node.json").token)')
          curl -fsS -H "Authorization: Bearer $udp_node_token" http://127.0.0.1:18081/api/node-agent/config > /tmp/pompnet-railway-udp-node-config.json
          node -e 'const x=require("/tmp/pompnet-railway-udp-node-config.json"); const types=(x.singBoxConfig?.inbounds||[]).map(i=>i.type); if(!types.includes("hysteria2")||!types.includes("tuic")) process.exit(1)'
          curl -fsS -H "Authorization: Bearer $udp_node_token" -H "Content-Type: application/json" \
            -d '{"agentVersion":"ci-test","xrayVersion":"ci-xray","platform":"linux","arch":"x64","configHash":"ci-udp-config"}' \
            http://127.0.0.1:18081/api/node-agent/heartbeat >/dev/null
          curl -fsS -H "Authorization: Bearer $owner_token" http://127.0.0.1:18081/api/users > /tmp/pompnet-railway-users.json
          user_id=$(node -e 'process.stdout.write(String(require("/tmp/pompnet-railway-users.json").users.find(u=>u.email==="sample-user").id))')
          curl -fsS -H "Authorization: Bearer $owner_token" -X PUT -H "Content-Type: application/json" \
            -d "{\"inboundIds\":[${wg_id},${vless_id},${hy2_id},${tuic_id}]}" "http://127.0.0.1:18081/api/users/$user_id" >/dev/null
          token=$(docker exec pompnet-railway-ci node --input-type=module -e '
            import { DatabaseSync } from "node:sqlite";
            const db = new DatabaseSync("/data/siderail.db");
            const row = db.prepare("SELECT sub_token FROM users WHERE email = ?").get("sample-user");
            if (!row) process.exit(1);
            process.stdout.write(row.sub_token);
            db.close();
          ')
          curl -fsS "http://127.0.0.1:18081/sub/$token?raw=1" | base64 -d > /tmp/pompnet-railway-sub.txt
          grep -q "^vless://" /tmp/pompnet-railway-sub.txt
          grep -q "^socks://.*@ci.proxy.rlwy.net:12345" /tmp/pompnet-railway-sub.txt
          grep -q "^wireguard://.*@wg-node.example.com:" /tmp/pompnet-railway-sub.txt
          grep -q "^vless://.*@vless-node.example.com:" /tmp/pompnet-railway-sub.txt
          grep -q "^hysteria2://.*@udp-node.example.com:" /tmp/pompnet-railway-sub.txt
          grep -q "^tuic://.*@udp-node.example.com:" /tmp/pompnet-railway-sub.txt
          ! grep -q "^http://" /tmp/pompnet-railway-sub.txt
          curl -fsS http://127.0.0.1:18081/api/capabilities | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.railway||!x.tcpProxy.configured||x.wireguardPublicUdp)process.exit(1)})'
          echo "Railway-mode Xray, subscription filtering and mapped SOCKS5 endpoint passed."
